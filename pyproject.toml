[project]
name = "ach-payment-platform"
version = "1.0.0"
description = "Production-grade ACH payment processing: idempotent API, durable PostgreSQL queue, resilient bank integration, signed webhooks, immutable audit trail."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["app", "mock_bank"]
