# Runs on every push and pull request: the full eval suite against a real
# PostgreSQL, then the mutation check. A red build blocks merging.
name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ach, POSTGRES_PASSWORD: ach, POSTGRES_DB: ach_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ach" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://ach:ach@localhost:5432/ach_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - name: Mutation check (do the evals catch real bugs?)
        run: python scripts/mutation_check.py
